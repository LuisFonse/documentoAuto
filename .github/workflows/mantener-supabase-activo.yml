# Mantiene activo el proyecto gratuito de Supabase.
# Supabase pausa los proyectos gratis tras 1 semana sin actividad:
# esta tarea consulta la base de datos cada 3 días para evitarlo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"   # cada 3 días, ~09:17 hora de Chile
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base de datos
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' supabase-config.js)
          KEY=$(grep -oP 'anonKey:\s*"\K[^"]+' supabase-config.js)
          RESPUESTA=$(curl -sS --fail -X POST "$URL/rest/v1/rpc/email_autorizado" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_email":"keepalive@altoke.invalid"}')
          echo "Supabase respondió: $RESPUESTA"

      # GitHub desactiva las tareas programadas si el repo pasa 60 días sin cambios.
      # Si el último cambio tiene más de 45 días, se deja un registro vacío para evitarlo.
      - name: Evitar que GitHub desactive esta tarea
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          AHORA=$(date +%s)
          DIAS=$(( (AHORA - ULTIMO) / 86400 ))
          echo "Días desde el último cambio: $DIAS"
          if [ "$DIAS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener tarea programada activa"
            git push
          fi
