<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta NFC | Mi Auto</title>
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css?v=7">
    <style>
        /* ===== Tamaño real de tarjeta CR80: 85.6 x 54 mm ===== */
        :root{
            --card-w:85.6mm;
            --card-h:54mm;
        }

        .panel-tarjeta{
            text-align:left;
        }

        .controles{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:10px;
            margin-top:12px;
        }

        .controles label{
            display:grid;
            gap:6px;
            font-size:13px;
            font-weight:600;
            color:var(--texto-2);
        }

        .controles input,
        .controles select{
            width:100%;
            font-family:inherit;
            font-size:15px;
            color:#fff;
            padding:11px 14px;
            border-radius:16px;
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.22);
            outline:none;
        }

        .controles .ancho{
            grid-column:1 / -1;
        }

        .acciones-tarjeta{
            display:flex;
            gap:10px;
            margin-top:16px;
            flex-wrap:wrap;
        }

        .acciones-tarjeta .admin-btn{
            flex:1;
            min-width:150px;
        }

        .vista-previa{
            display:grid;
            gap:22px;
            justify-items:center;
            margin:26px 0 10px;
        }

        .lado-titulo{
            font-size:12px;
            font-weight:600;
            letter-spacing:.8px;
            text-transform:uppercase;
            color:var(--texto-3);
            margin-bottom:8px;
            text-align:center;
        }

        /* La tarjeta en pantalla se dibuja a escala, en impresión a tamaño real */
        .vista-previa > div{
            width:100%;
        }

        .escala{
            margin:0 auto;
            width:min(100%, 480px);
            aspect-ratio:85.6 / 54;
            position:relative;
        }

        .escala .nfc-card{
            position:absolute;
            top:0;
            left:0;
            transform-origin:top left;
        }

        /* ===================== DISEÑO DE LA TARJETA ===================== */

        .nfc-card{
            width:var(--card-w);
            height:var(--card-h);
            border-radius:3.2mm;
            overflow:hidden;
            position:relative;
            color:#fff;
            text-align:left;
            font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
            background:#0d1330;
            box-shadow:0 18px 40px -10px rgba(0,0,0,.6);
            -webkit-print-color-adjust:exact;
            print-color-adjust:exact;
        }

        .nfc-card .fondo{
            position:absolute;
            inset:-20%;
            background:
                radial-gradient(40% 45% at 12% 10%, rgba(10,132,255,.95), transparent 70%),
                radial-gradient(38% 42% at 92% 18%, rgba(191,90,242,.85), transparent 70%),
                radial-gradient(42% 46% at 78% 96%, rgba(255,159,10,.65), transparent 70%),
                radial-gradient(36% 40% at 8% 92%, rgba(100,210,255,.7), transparent 70%),
                linear-gradient(160deg, #0b1022, #161d42);
            filter:blur(3mm);
        }

        .nfc-card .vidrio{
            position:absolute;
            border-radius:2.6mm;
            background:linear-gradient(155deg, rgba(255,255,255,.24), rgba(255,255,255,.06) 50%, rgba(255,255,255,.12));
            border:.25mm solid rgba(255,255,255,.38);
            box-shadow:inset 0 .3mm 0 rgba(255,255,255,.6);
        }

        /* ---- FRENTE ---- */
        .frente .vidrio{
            left:4mm;
            right:4mm;
            bottom:4mm;
            height:20mm;
        }

        .marca{
            position:absolute;
            top:4.6mm;
            left:5mm;
            display:flex;
            align-items:center;
            gap:2.2mm;
        }

        .marca svg{
            width:9mm;
            height:9mm;
            filter:drop-shadow(0 .6mm 1.2mm rgba(0,0,0,.35));
        }

        .marca-texto{
            line-height:1;
        }

        .marca-texto strong{
            display:block;
            font-size:4.4mm;
            font-weight:800;
            letter-spacing:-.15mm;
        }

        .marca-texto span{
            display:block;
            margin-top:.8mm;
            font-size:1.9mm;
            font-weight:500;
            letter-spacing:.25mm;
            text-transform:uppercase;
            opacity:.8;
        }

        .icono-nfc{
            position:absolute;
            top:5mm;
            right:5mm;
            width:7.5mm;
            height:7.5mm;
            opacity:.92;
        }

        .datos-usuario{
            position:absolute;
            left:7.5mm;
            right:7.5mm;
            bottom:7.2mm;
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:3mm;
        }

        .datos-usuario .etiqueta{
            font-size:1.8mm;
            font-weight:600;
            letter-spacing:.3mm;
            text-transform:uppercase;
            opacity:.7;
        }

        .datos-usuario .nombre{
            margin-top:.8mm;
            font-size:4.6mm;
            font-weight:700;
            letter-spacing:-.1mm;
            line-height:1.1;
            max-width:52mm;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .datos-usuario .patente{
            flex-shrink:0;
            padding:1.1mm 2.6mm;
            border-radius:10mm;
            font-size:3mm;
            font-weight:700;
            letter-spacing:.45mm;
            background:rgba(255,255,255,.16);
            border:.25mm solid rgba(255,255,255,.4);
        }

        .datos-usuario .patente:empty{
            display:none;
        }

        /* ---- REVERSO ---- */
        .reverso .vidrio{
            top:4mm;
            bottom:4mm;
            left:4mm;
            width:31mm;
        }

        .qr-caja{
            position:absolute;
            top:7mm;
            left:7mm;
            width:25mm;
            height:25mm;
            padding:1.4mm;
            border-radius:2mm;
            background:#fff;
        }

        .qr-caja svg,
        .qr-caja img{
            width:100%;
            height:100%;
            display:block;
        }

        .qr-leyenda{
            position:absolute;
            left:4mm;
            width:31mm;
            bottom:7mm;
            text-align:center;
            font-size:2mm;
            font-weight:600;
            letter-spacing:.2mm;
            opacity:.85;
        }

        .instrucciones{
            position:absolute;
            left:40mm;
            right:5mm;
            top:7mm;
        }

        .instrucciones h3{
            margin:0 0 2.4mm;
            font-size:3.4mm;
            font-weight:700;
            letter-spacing:-.05mm;
        }

        .instrucciones .paso{
            display:flex;
            align-items:center;
            gap:2mm;
            margin-bottom:2.2mm;
            font-size:2.35mm;
            line-height:1.3;
            opacity:.92;
        }

        .instrucciones .paso b{
            flex-shrink:0;
            width:4.4mm;
            height:4.4mm;
            display:grid;
            place-items:center;
            border-radius:50%;
            font-size:2.2mm;
            background:rgba(255,255,255,.18);
            border:.2mm solid rgba(255,255,255,.4);
        }

        .reverso .pie{
            position:absolute;
            left:40mm;
            right:5mm;
            bottom:6mm;
            font-size:1.8mm;
            line-height:1.4;
            opacity:.65;
        }

        .reverso .marca-mini{
            position:absolute;
            right:5mm;
            bottom:5.4mm;
            width:5.5mm;
            height:5.5mm;
            opacity:.9;
        }

        /* ===================== IMPRESIÓN ===================== */

        #zonaImpresion{
            display:none;
        }

        @media print{
            body::before,
            body::after{
                display:none !important;
            }

            body{
                background:#fff !important;
            }

            .contenedor{
                display:none !important;
            }

            #zonaImpresion{
                display:block;
            }

            .nfc-card{
                box-shadow:none;
            }
        }

        /* Modo tarjeta: cada lado en su propia página del tamaño exacto */
        body.modo-tarjeta #zonaImpresion .hoja{
            width:var(--card-w);
            height:var(--card-h);
            page-break-after:always;
            break-after:page;
        }

        body.modo-tarjeta #zonaImpresion .nfc-card{
            border-radius:0;
        }

        /* Modo hoja: ambos lados en una hoja con marcas de corte (para adhesivo o cartulina) */
        body.modo-hoja #zonaImpresion .hoja{
            display:flex;
            gap:12mm;
            padding:20mm 15mm;
        }

        body.modo-hoja #zonaImpresion .corte{
            position:relative;
            outline:.1mm dashed #999;
            outline-offset:1.5mm;
        }

        @media (max-width:700px){
            .controles{
                grid-template-columns:1fr;
            }
        }
    </style>
    <style id="estiloPagina">@page{ size:85.6mm 54mm; margin:0; }</style>
</head>
<body class="modo-tarjeta">

<div class="contenedor admin-contenedor">

    <header class="hero">
        <div class="hero-icono">
            <i class="bi bi-credit-card-2-front-fill"></i>
        </div>
        <div class="hero-modelo">Tarjeta NFC</div>
        <div class="hero-subtitulo">Diseño para imprimir, tamaño real 85,6 × 54 mm</div>
    </header>

    <section class="tarjeta admin-card panel-tarjeta">
        <h2><i class="bi bi-sliders"></i> Datos de la tarjeta</h2>

        <div class="controles">
            <label>
                Nombre en la tarjeta
                <input id="inNombre" type="text" maxlength="28" placeholder="Nombre del usuario">
            </label>
            <label>
                Patente
                <input id="inPatente" type="text" maxlength="10" placeholder="Opcional">
            </label>
            <label class="ancho">
                ¿Cómo la vas a imprimir?
                <select id="inModo">
                    <option value="tarjeta">Impresora de tarjetas PVC (cada lado a tamaño exacto)</option>
                    <option value="hoja">Hoja carta / A4 con marcas de corte (adhesivo o cartulina)</option>
                </select>
            </label>
        </div>

        <div class="acciones-tarjeta">
            <button id="btnImprimir" class="admin-btn principal"><i class="bi bi-printer-fill"></i> Imprimir / Guardar PDF</button>
            <a id="btnProbar" class="admin-btn secundario" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Probar link</a>
        </div>

        <p class="ayuda-texto" id="linkTexto"></p>
    </section>

    <div class="vista-previa">
        <div>
            <div class="lado-titulo">Frente</div>
            <div class="escala" id="escalaFrente"></div>
        </div>
        <div>
            <div class="lado-titulo">Reverso</div>
            <div class="escala" id="escalaReverso"></div>
        </div>
    </div>
</div>

<!-- Aquí se copian los dos lados a tamaño real para imprimir -->
<div id="zonaImpresion"></div>

<!-- ===== Plantillas ===== -->
<template id="plantillaLogo">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <linearGradient id="gLogo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4cb3ff"/>
                <stop offset="1" stop-color="#7b5cff"/>
            </linearGradient>
            <linearGradient id="gBrillo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
                <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gLogo)"/>
        <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gBrillo)"/>
        <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".55"/>
        <!-- auto de frente -->
        <path d="M19 30 L23.5 20.5 Q24.6 18 27.4 18 H36.6 Q39.4 18 40.5 20.5 L45 30 Z" fill="#fff" fill-opacity=".95"/>
        <rect x="14" y="29" width="36" height="13" rx="5" fill="#fff"/>
        <circle cx="21" cy="35.5" r="2.6" fill="#5a7dff"/>
        <circle cx="43" cy="35.5" r="2.6" fill="#5a7dff"/>
        <rect x="27" y="34.2" width="10" height="2.6" rx="1.3" fill="#5a7dff" fill-opacity=".6"/>
        <rect x="16.5" y="41" width="6" height="5.5" rx="2" fill="#fff"/>
        <rect x="41.5" y="41" width="6" height="5.5" rx="2" fill="#fff"/>
        <path d="M26 22.5 H38 L40.5 28 H23.5 Z" fill="#5a7dff" fill-opacity=".35"/>
    </svg>
</template>

<template id="plantillaNfc">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
        <path d="M6.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M10 6a9 9 0 0 1 0 12"/>
        <path d="M13.5 3.5a13 13 0 0 1 0 17"/>
        <circle cx="3.5" cy="12" r="1" fill="#fff" stroke="none"/>
    </svg>
</template>

<template id="plantillaFrente">
    <div class="nfc-card frente">
        <div class="fondo"></div>
        <div class="vidrio"></div>
        <div class="marca">
            <span data-logo></span>
            <div class="marca-texto">
                <strong>Mi Auto</strong>
                <span>Documentos del vehículo</span>
            </div>
        </div>
        <span class="icono-nfc" data-nfc></span>
        <div class="datos-usuario">
            <div>
                <div class="etiqueta">Titular</div>
                <div class="nombre" data-nombre></div>
            </div>
            <div class="patente" data-patente></div>
        </div>
    </div>
</template>

<template id="plantillaReverso">
    <div class="nfc-card reverso">
        <div class="fondo"></div>
        <div class="vidrio"></div>
        <div class="qr-caja" data-qr></div>
        <div class="qr-leyenda">Escanea para ver</div>
        <div class="instrucciones">
            <h3>Documentos al instante</h3>
            <div class="paso"><b>1</b> Acerca un teléfono a la tarjeta</div>
            <div class="paso"><b>2</b> o escanea el código QR</div>
            <div class="paso"><b>3</b> Revisa permiso, SOAP y padrón</div>
        </div>
        <div class="pie">Si encuentras esta tarjeta,<br>por favor devuélvela a su titular.</div>
        <span class="marca-mini" data-logo></span>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("codigo") || params.get("card") || "";

    const inNombre = document.getElementById("inNombre");
    const inPatente = document.getElementById("inPatente");
    const inModo = document.getElementById("inModo");

    inNombre.value = params.get("nombre") || "";
    inPatente.value = (params.get("patente") || "").toUpperCase();

    const base = window.location.href.replace(/tarjeta\.html.*$/, "");
    const linkFicha = `${base}index.html?card=${encodeURIComponent(codigo)}`;

    document.getElementById("btnProbar").href = linkFicha;
    document.getElementById("linkTexto").innerHTML = codigo
        ? `Link que debes grabar en el chip NFC:<br><strong style="word-break:break-all;color:#fff">${linkFicha}</strong>`
        : `<strong style="color:#ff8a80">Falta el código del usuario. Abre esta página desde el botón "Tarjeta" del panel admin.</strong>`;

    let svgQr = "";
    if (codigo && window.qrcode) {
        const qr = window.qrcode(0, "M");
        qr.addData(linkFicha);
        qr.make();
        svgQr = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } else if (codigo) {
        svgQr = `<div style="display:grid;place-items:center;height:100%;color:#c62828;font-size:2.2mm;text-align:center">No se pudo generar el QR. Recarga la página.</div>`;
    }

    const logoHtml = document.getElementById("plantillaLogo").innerHTML;
    const nfcHtml = document.getElementById("plantillaNfc").innerHTML;

    let contadorLogo = 0;

    // Cada copia del logo necesita ids propios para sus degradados
    function logoUnico() {
        contadorLogo += 1;
        return logoHtml
            .replaceAll("gLogo", `gLogo${contadorLogo}`)
            .replaceAll("gBrillo", `gBrillo${contadorLogo}`);
    }

    function construirLado(idPlantilla) {
        const nodo = document.getElementById(idPlantilla).content.firstElementChild.cloneNode(true);
        nodo.querySelectorAll("[data-logo]").forEach((el) => { el.innerHTML = logoUnico(); });
        nodo.querySelectorAll("[data-nfc]").forEach((el) => { el.innerHTML = nfcHtml; });
        const nombre = nodo.querySelector("[data-nombre]");
        if (nombre) nombre.textContent = inNombre.value.trim() || "Nombre Apellido";
        const patente = nodo.querySelector("[data-patente]");
        if (patente) patente.textContent = inPatente.value.trim().toUpperCase();
        const qr = nodo.querySelector("[data-qr]");
        if (qr) qr.innerHTML = svgQr;
        return nodo;
    }

    function ajustarEscala() {
        document.querySelectorAll(".escala").forEach((caja) => {
            const tarjeta = caja.querySelector(".nfc-card");
            if (!tarjeta) return;
            const escala = caja.clientWidth / tarjeta.offsetWidth;
            tarjeta.style.transform = `scale(${escala})`;
        });
    }

    function render() {
        const frente = document.getElementById("escalaFrente");
        const reverso = document.getElementById("escalaReverso");
        frente.replaceChildren(construirLado("plantillaFrente"));
        reverso.replaceChildren(construirLado("plantillaReverso"));
        ajustarEscala();

        const zona = document.getElementById("zonaImpresion");
        zona.innerHTML = "";

        if (inModo.value === "tarjeta") {
            ["plantillaFrente", "plantillaReverso"].forEach((id) => {
                const hoja = document.createElement("div");
                hoja.className = "hoja";
                hoja.appendChild(construirLado(id));
                zona.appendChild(hoja);
            });
        } else {
            const hoja = document.createElement("div");
            hoja.className = "hoja";
            ["plantillaFrente", "plantillaReverso"].forEach((id) => {
                const corte = document.createElement("div");
                corte.className = "corte";
                corte.appendChild(construirLado(id));
                hoja.appendChild(corte);
            });
            zona.appendChild(hoja);
        }

        document.body.className = `modo-${inModo.value}`;
        document.getElementById("estiloPagina").textContent = inModo.value === "tarjeta"
            ? "@page{ size:85.6mm 54mm; margin:0; }"
            : "@page{ size:auto; margin:0; }";
    }

    [inNombre, inPatente, inModo].forEach((el) => el.addEventListener("input", render));
    window.addEventListener("resize", ajustarEscala);
    document.getElementById("btnImprimir").addEventListener("click", () => window.print());

    render();
});
</script>
</body>
</html>
