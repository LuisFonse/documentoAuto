<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Documentos Vehículo</title>
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="contenedor admin-contenedor">

    <header class="hero">
        <div class="hero-icono">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="hero-modelo">Panel Administrador</div>
        <div class="hero-subtitulo">Registro de usuarios habilitados</div>
    </header>

    <div id="estadoApp" class="admin-estado"></div>

    <section id="loginCard" class="tarjeta admin-card">
        <h2><i class="bi bi-box-arrow-in-right"></i> Acceso Admin</h2>
        <form id="loginForm" class="admin-form">
            <label>Email</label>
            <input id="emailInput" type="email" required placeholder="admin@correo.com" autocomplete="username">

            <label>Contraseña</label>
            <input id="passwordInput" type="password" required placeholder="********" autocomplete="current-password">

            <button type="submit" class="admin-btn principal">Iniciar sesión</button>
        </form>
    </section>

    <section id="adminPanel" class="admin-panel oculto">

        <div class="tarjeta admin-card">
            <div class="admin-header-row">
                <h2><i class="bi bi-people-fill"></i> Usuarios habilitados</h2>
                <button id="logoutBtn" class="admin-btn secundario">Cerrar sesión</button>
            </div>

            <p class="ayuda-texto">
                Registra al usuario con su email. Luego el usuario entra a
                <a id="linkPortal" class="link-simple" href="mi-auto.html" target="_blank" rel="noopener">mi-auto.html</a>,
                crea su clave y sube sus documentos.
            </p>

            <form id="clienteForm" class="admin-grid-form">
                <input id="clienteNombre" type="text" required placeholder="Nombre cliente">
                <input id="clienteEmail" type="email" required placeholder="Email cliente (para su acceso)">
                <input id="clienteTelefono" type="text" placeholder="Teléfono">
                <div class="campo-codigo">
                    <input id="clienteNfc" type="text" required readonly title="Se genera automáticamente">
                    <button id="regenerarNfc" type="button" class="admin-btn secundario" title="Generar otro código">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
                <label class="check-inline">
                    <input id="clienteHabilitado" type="checkbox" checked>
                    Habilitado
                </label>
                <div class="botones-fila">
                    <button id="clienteSubmit" type="submit" class="admin-btn principal">Crear usuario</button>
                    <button id="clienteCancelar" type="button" class="admin-btn secundario oculto">Cancelar</button>
                </div>
            </form>

            <div class="tabla-scroll">
                <table class="admin-tabla">
                    <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>NFC</th>
                        <th>Vehículo</th>
                        <th>Docs</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="clientesBody"></tbody>
                </table>
            </div>
        </div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script src="admin.js?v=5"></script>
</body>
</html>
